name: Mise a jour des stats LNH
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: maj-stats
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python maj.py
      - name: Publier si les stats ont change
        run: |
          git config user.name "pool-bot"
          git config user.email "pool-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Stats LNH $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
